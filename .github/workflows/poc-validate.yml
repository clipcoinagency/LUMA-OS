name: "PoC · browser storage validation"

on:
  push:
    paths: ["poc/web/**", "poc/tests/validate.mjs", "poc/tests/serve.mjs", "poc/tests/annotate.mjs", "package.json", ".github/workflows/poc-validate.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poc-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            only: edge,chrome,firefox,webkit,edge-app,tz
          - os: macos-latest
            only: chrome,firefox,webkit,tz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install firefox webkit
      - name: Validate (Playwright, real browser restarts)
        run: node poc/tests/validate.mjs --only=${{ matrix.only }} --stress=5000
        timeout-minutes: 25
        continue-on-error: true
      - name: Real Safari via safaridriver (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo safaridriver --enable
          node poc/tests/safari-webdriver.mjs
        timeout-minutes: 5
        continue-on-error: true
      - name: Summary
        if: always()
        shell: bash
        run: |
          cat poc/tests/results/VALIDATION-RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Real Safari (safaridriver)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat poc/tests/results/safari-webdriver.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'n/a' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat poc/tests/results/VALIDATION-RESULTS.md || true
          cat poc/tests/results/safari-webdriver.json 2>/dev/null || true
      - name: Annotations (readable without login)
        if: always()
        run: node poc/tests/annotate.mjs "${{ runner.os }}"
      - name: Publish results to ci-results branch
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/out && cp -r poc/tests/results/. /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b "ci-results-${{ runner.os }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Validation results for ${{ github.sha }} (${{ runner.os }})" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:ci-results-${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: poc/tests/results/
